version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep declarations aligned with the supported Node 24 runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # openapi-typescript requires the TypeScript 5 compiler API.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Runtime migrations must update engines, CI and the image together.
      - dependency-name: node
        update-types: ['version-update:semver-major']
