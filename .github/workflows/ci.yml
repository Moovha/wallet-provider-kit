name: verify
on:
  push:
    branches: [main, codex/toolkit]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.11.1 --ignore-scripts
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run check:package
      - run: node scripts/smoke-built.mjs
      - run: node scripts/smoke-ows.mjs
      - run: npm audit --audit-level=low
      - run: mkdir -p artifacts
      - run: npm run sbom --silent > artifacts/sbom.cdx.json
      - run: npm pack --pack-destination artifacts
      - run: docker build -t wallet-provider-kit:verify .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: artifacts/
          retention-days: 14
