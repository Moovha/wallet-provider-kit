name: Package provider release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Experimental provider release version (without provider-v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: provider-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/provider-v$RELEASE_VERSION" > release-refs.json
          node --input-type=module -e 'import fs from "node:fs"; const tag = "refs/tags/provider-v" + process.env.RELEASE_VERSION; if (JSON.parse(fs.readFileSync("release-refs.json")).some(ref => ref.ref === tag)) process.exit(1);'
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
      - run: npm install --global npm@11.11.1 --ignore-scripts
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run check:package
      - run: npm audit --audit-level=low
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build immutable images and release bundle
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --metadata-file api.json --push --tag "ghcr.io/moovha/wallet-provider-kit:provider-v$RELEASE_VERSION" .
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --metadata-file bundler.json --push --file Dockerfile.bundler --tag "ghcr.io/moovha/wallet-provider-kit-bundler:provider-v$RELEASE_VERSION" .
          API_DIGEST=$(node -p "JSON.parse(require('fs').readFileSync('api.json'))['containerimage.digest']")
          BUNDLER_DIGEST=$(node -p "JSON.parse(require('fs').readFileSync('bundler.json'))['containerimage.digest']")
          node scripts/package-provider-release.mjs "$API_DIGEST" "$BUNDLER_DIGEST"
          npm run sbom --silent > artifacts/provider-release/sbom.cdx.json
          tar -czf artifacts/provider-release.tgz -C artifacts/provider-release .
          (cd artifacts && sha256sum provider-release.tgz > provider-release.tgz.sha256)
          printf 'api_digest=%s\nbundler_digest=%s\n' "$API_DIGEST" "$BUNDLER_DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/moovha/wallet-provider-kit
          subject-digest: ${{ steps.build.outputs.api_digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/moovha/wallet-provider-kit-bundler
          subject-digest: ${{ steps.build.outputs.bundler_digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/provider-release.tgz
      - name: Publish experimental release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "provider-v$RELEASE_VERSION" artifacts/provider-release.tgz artifacts/provider-release.tgz.sha256 --target "$GITHUB_SHA" --prerelease --title "Provider deployment $RELEASE_VERSION" --notes-file packaging/release-notes.md
