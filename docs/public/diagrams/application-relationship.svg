    </g>
    <text x="858" y="360" fill="#0f2338" font-size="28" font-weight="700">
      <tspan x="858" dy="0">Wallet backend</tspan>
    </text>
    <text x="858" y="400" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="858" dy="0">Creates wallet accounts</tspan>
      <tspan x="858" dy="30.8">Signs approved actions</tspan>
    </text>
    <path
      d="M774 330H836"
