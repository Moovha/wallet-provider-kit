      stroke="#0f2338"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <ellipse cx="24" cy="9" rx="21" ry="7" />
      <path d="M3 9v29c0 10 42 10 42 0V9M3 23c0 10 42 10 42 0" />
    </g>
    <text x="538" y="633" fill="#0f2338" font-size="27" font-weight="700">
      <tspan x="538" dy="0">Private durable records</tspan>
    </text>
    <text x="538" y="673" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="538" dy="0">Owner binding · grants · immutable actions</tspan>
      <tspan x="538" dy="30.8">Attempts and verified results</tspan>
    </text>
    <text x="48" y="796" fill="#526c83" font-size="23" font-weight="400">
      <tspan x="48" dy="0">
        The backend determines key control and recovery. Applications never
        receive private keys.
      </tspan>
    </text>
    <path
      d="M570 474V592"
      fill="none"
      stroke="#12bfde"
      stroke-width="3"
      marker-start="url(#back)"
      marker-end="url(#arrow)"
    />
    <path
      d="M1002 474V592"
      fill="none"
      stroke="#12bfde"
      stroke-width="3"
      marker-start="url(#back)"
      marker-end="url(#arrow)"
    />
    <text x="610" y="539" fill="#526c83" font-size="22">
      Read authority · record attempts
    </text>
  </g>
</svg>
