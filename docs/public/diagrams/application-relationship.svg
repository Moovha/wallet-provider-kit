      <tspan x="470" dy="0">Policy + authority</tspan>
    </text>
    <text x="470" y="400" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="470" dy="0">Current grants and consent</tspan>
      <tspan x="470" dy="30.8">Identity + exact-action limits</tspan>
    </text>
    <rect
      x="836"
