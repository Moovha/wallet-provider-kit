<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="830"
  viewBox="0 0 1200 830"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Account owner, application and wallet provider</title>
  <desc id="description">
    The account owner signs in, completes identity checks and approves access
    within the connected application. The application submits authenticated
    requests and user evidence to the wallet service. Provider policy checks
    current grants, consent, identity and exact-action limits against private
    durable records. The chosen wallet backend creates accounts and signs only
    approved actions. Only permitted results return to the application; private
    keys remain in the backend.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0 10 5 0 10Z" fill="#12bfde" />
    </marker>
    <marker
      id="back"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0 10 5 0 10Z" fill="#12bfde" />
    </marker>
  </defs>
  <rect width="1200" height="830" rx="22" fill="white" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="68" fill="#0f2338" font-size="40" font-weight="700">
      <tspan x="48" dy="0">Your product. Your wallet service.</tspan>
    </text>
    <text x="48" y="110" fill="#526c83" font-size="24" font-weight="400">
      <tspan x="48" dy="0">
        Users stay in the application. The provider controls wallet access.
      </tspan>
    </text>
    <rect
      x="420"
      y="160"
      width="756"
      height="590"
      rx="18"
      fill="#f0faff"
      stroke="#bfe5f1"
      stroke-width="2"
    />
    <text x="448" y="204" fill="#526c83" font-size="20" font-weight="700">
      <tspan x="448" dy="0">YOUR WALLET SERVICE</tspan>
    </text>
    <rect
      x="48"
      y="160"
      width="300"
      height="160"
      rx="18"
      fill="white"
      stroke="#bfe5f1"
      stroke-width="2"
    />
    <g
      transform="translate(70 184)"
      fill="none"
      stroke="#0f2338"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="24" cy="12" r="10" />
      <path d="M5 45v-3a19 19 0 0 1 38 0v3Z" />
    </g>
    <text x="70" y="265" fill="#0f2338" font-size="28" font-weight="700">
      <tspan x="70" dy="0">Account owner</tspan>
    </text>
    <text x="70" y="300" fill="#526c83" font-size="20" font-weight="400">
      <tspan x="70" dy="0">Approves access in the app</tspan>
    </text>
    <path
      d="M318 320V428"
      fill="none"
      stroke="#12bfde"
      stroke-width="3"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <text x="48" y="363" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="48" dy="0">Login, identity checks</tspan>
      <tspan x="48" dy="30.8">and access consent</tspan>
    </text>
    <rect
      x="48"
      y="430"
      width="300"
      height="200"
      rx="18"
