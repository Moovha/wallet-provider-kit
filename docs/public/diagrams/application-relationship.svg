      <rect x="29" y="3" width="16" height="16" rx="3" />
      <rect x="3" y="29" width="16" height="16" rx="3" />
      <rect x="29" y="29" width="16" height="16" rx="3" />
    </g>
    <text x="70" y="534" fill="#0f2338" font-size="25" font-weight="700">
      <tspan x="70" dy="0">Connected application</tspan>
    </text>
    <text x="70" y="573" fill="#526c83" font-size="21" font-weight="400">
      <tspan x="70" dy="0">Attests identity + consent</tspan>
      <tspan x="70" dy="29.4">Requests permitted actions</tspan>
    </text>
    <rect
      x="448"
