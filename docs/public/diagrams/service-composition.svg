      fill="none"
      stroke="#12bfde"
      stroke-width="3"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
      marker-start="url(#back)"
    />
    <text x="1018" y="567" fill="#526c83" font-size="20" font-weight="400">
      <tspan x="1018" dy="0">Claim +</tspan>
      <tspan x="1018" dy="28">save result</tspan>
    </text>
    <rect
      x="450"
      y="616"
      width="702"
      height="104"
      rx="18"
      fill="white"
      stroke="#bfe5f1"
      stroke-width="2"
    />
    <g
      transform="translate(470 643)"
      fill="none"
      stroke="#0f2338"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
