<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="820"
  viewBox="0 0 1200 820"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Wallet service layers</title>
  <desc id="description">
    The connected application calls the HTTP API. The API authenticates the
    caller and passes the request to policy checks for current owner, grant,
    KYC, consent, permitted limits and the exact approved action. Policy uses
    stored authority records. The wallet backend signs only admitted actions
    after a durable claim and a current permission recheck; verified results are
    persisted. Missing or stale authority denies the request. OAuth scopes alone
    never authorize spending.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0 10 5 0 10Z" fill="#12bfde" />
    </marker>
    <marker
      id="back"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0 10 5 0 10Z" fill="#12bfde" />
    </marker>
  </defs>
  <rect width="1200" height="820" rx="22" fill="white" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="68" fill="#0f2338" font-size="40" font-weight="700">
      <tspan x="48" dy="0">Inside your wallet service</tspan>
    </text>
    <text x="48" y="108" fill="#526c83" font-size="24" font-weight="400">
      <tspan x="48" dy="0">
        An authenticated request must pass current policy before signing.
      </tspan>
    </text>
    <rect
      x="48"
      y="145"
      width="380"
      height="60"
      rx="18"
      fill="white"
      stroke="#bfe5f1"
      stroke-width="2"
    />
    <g
      transform="translate(64 152)"
      fill="none"
      stroke="#0f2338"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="3" width="16" height="16" rx="3" />
      <rect x="29" y="3" width="16" height="16" rx="3" />
      <rect x="3" y="29" width="16" height="16" rx="3" />
      <rect x="29" y="29" width="16" height="16" rx="3" />
    </g>
    <text x="130" y="183" fill="#0f2338" font-size="25" font-weight="700">
      <tspan x="130" dy="0">Connected application</tspan>
    </text>
    <rect
      x="24"
      y="240"
      width="1152"
      height="502"
      rx="18"
      fill="#f0faff"
      stroke="#bfe5f1"
      stroke-width="2"
    />
    <text x="48" y="280" fill="#526c83" font-size="18" font-weight="700">
      <tspan x="48" dy="0">PROVIDER SERVICE</tspan>
    </text>
    <rect
      x="48"
      y="308"
      width="300"
      height="220"
      rx="18"
      fill="white"
      stroke="#bfe5f1"
      stroke-width="2"
    />
    <path
