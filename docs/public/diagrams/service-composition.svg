    </text>
    <text x="874" y="454" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="874" dy="0">Use the chosen backend</tspan>
      <tspan x="874" dy="30.8">Sign admitted actions only</tspan>
      <tspan x="874" dy="30.8">Verify digest + signer</tspan>
    </text>
    <path
      d="M348 410H450"
      fill="none"
