    <text x="70" y="454" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="70" dy="0">Authenticate the caller</tspan>
      <tspan x="70" dy="30.8">Validate the request</tspan>
      <tspan x="70" dy="30.8">Admit required scopes</tspan>
    </text>
    <rect
      x="450"
