      <ellipse cx="24" cy="9" rx="21" ry="7" />
      <path d="M3 9v29c0 10 42 10 42 0V9M3 23c0 10 42 10 42 0" />
    </g>
    <text x="538" y="653" fill="#0f2338" font-size="27" font-weight="700">
      <tspan x="538" dy="0">Storage layer</tspan>
    </text>
    <text x="538" y="689" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="538" dy="0">
        Grants · approvals · budgets · attempts · results
      </tspan>
    </text>
    <text x="48" y="594" fill="#0f2338" font-size="25" font-weight="700">
      <tspan x="48" dy="0">Missing or stale</tspan>
      <tspan x="48" dy="35">authority → deny</tspan>
    </text>
    <text x="48" y="668" fill="#526c83" font-size="22" font-weight="400">
      <tspan x="48" dy="0">Record the durable claim.</tspan>
      <tspan x="48" dy="30.8">Recheck before dispatch.</tspan>
    </text>
    <text x="48" y="782" fill="#526c83" font-size="23" font-weight="400">
      <tspan x="48" dy="0">
        OAuth scopes alone never authorize spending. Keys stay within the wallet
