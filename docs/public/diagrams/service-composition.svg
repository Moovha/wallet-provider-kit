    <text x="367" y="391" fill="#526c83" font-size="20" font-weight="400">
      <tspan x="367" dy="0">Check</tspan>
    </text>
    <text x="768" y="391" fill="#526c83" font-size="20" font-weight="400">
      <tspan x="768" dy="0">Allow</tspan>
    </text>
    <path
