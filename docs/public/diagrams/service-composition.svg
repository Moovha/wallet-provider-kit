      fill="none"
      stroke="#12bfde"
      stroke-width="3"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <g
      transform="translate(70 330)"
      fill="none"
      stroke="#0f2338"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
